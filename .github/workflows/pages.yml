name: Publish learning module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for uploaded artifact to be available
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 8; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
                core.info('Pages artifact is ready for deployment.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact is not yet available; retry this deployment.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
